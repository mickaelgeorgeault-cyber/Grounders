<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — Grounders</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="logo">
          <span class="logo-icon">G</span>
          <span class="logo-text">Grounders</span>
        </a>
        <h1>Créer un compte</h1>
        <p>Rejoignez la communauté en quelques secondes</p>
      </div>
      <form class="auth-form" id="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" placeholder="Jean" required>
          </div>
          <div class="form-group">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" placeholder="Dupont" required>
          </div>
        </div>
        <div class="form-group">
          <label for="email">Adresse email</label>
          <input type="email" id="email" placeholder="vous@exemple.com" required>
        </div>
        <div class="form-group">
          <label for="company">Entreprise</label>
          <input type="text" id="company" placeholder="Nom de votre société">
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="Min. 8 caractères" required minlength="8">
        </div>
        <div class="form-group">
          <label for="sector">Secteur d'activité</label>
          <select id="sector" required>
            <option value="">Sélectionnez votre secteur</option>
            <option value="tech">Technologie & IT</option>
            <option value="finance">Finance & Assurance</option>
            <option value="immobilier">Immobilier</option>
            <option value="sante">Santé</option>
            <option value="industrie">Industrie</option>
            <option value="services">Services aux entreprises</option>
            <option value="commerce">Commerce & Distribution</option>
            <option value="autre">Autre</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
      </form>
      <div class="auth-footer">
        <p>Déjà inscrit ? <a href="login.html">Se connecter</a></p>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
