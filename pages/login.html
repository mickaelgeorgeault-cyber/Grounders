<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Grounders</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="logo">
          <span class="logo-icon">G</span>
          <span class="logo-text">Grounders</span>
        </a>
        <h1>Bienvenue</h1>
        <p>Connectez-vous à votre espace professionnel</p>
      </div>
      <form class="auth-form" id="auth-form">
        <div class="form-group">
          <label for="email">Adresse email</label>
          <input type="email" id="email" placeholder="vous@exemple.com" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>
      <div class="auth-footer">
        <p>Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
